[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docconvert"
version = "0.1.0"
description = "Small document converter: docx, pdf, md, txt, html"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-docx>=1.1",
    "pypdf>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docconvert = "docconvert.cli:main"

[tool.setuptools.packages.find]
include = ["docconvert*"]
